name: Launcher

on: pull_request

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install BusyBox
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Build and exercise the launcher
        run: |
          bazelisk build //targets/cc_binary:gizlet
          bazelisk test //tests:launcher_test --test_output=all
