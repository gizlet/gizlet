allowBuilds:
  esbuild: true
  workerd: true
# pnpm holds back releases younger than a day. The project tracks the newest
# Cloudflare and Hono releases, so these publishers are exempt; everything
# else keeps the delay.
minimumReleaseAgeExclude:
  - hono
  - wrangler
  - miniflare
  - workerd
  - "@cloudflare/*"
  - "@better-auth/core@1.7.28"
  - "@better-auth/drizzle-adapter@1.7.28"
  - "@better-auth/kysely-adapter@1.7.28"
  - "@better-auth/memory-adapter@1.7.28"
  - "@better-auth/mongo-adapter@1.7.28"
  - "@better-auth/prisma-adapter@1.7.28"
  - "@better-auth/telemetry@1.7.28"
  - better-auth@1.7.28
  - "@types/node@26.6.7"
